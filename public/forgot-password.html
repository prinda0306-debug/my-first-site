<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忘記密碼 | 拾光花</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<nav>
  <a class="logo" href="index.html">拾光花</a>
  <div class="nav-links">
    <a href="index.html">回首頁</a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <h1>忘記密碼</h1>
    <p class="auth-sub">輸入註冊時使用的 Email,我們會寄送重設密碼連結給你</p>

    <form id="forgot-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required maxlength="100">
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">寄送重設連結</button>
      <p class="form-msg" id="form-msg"></p>
    </form>

    <div class="auth-links">
      想起密碼了？<a href="login.html">前往登入</a>
    </div>
  </div>
</div>

<script>
(function(){
  const form = document.getElementById('forgot-form');
  const msgEl = document.getElementById('form-msg');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    msgEl.textContent = '';
    msgEl.className = 'form-msg';
    submitBtn.disabled = true;
    submitBtn.textContent = '送出中...';

    fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value.trim() }),
    })
      .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(r){
        if (!r.ok) throw new Error(r.data.error || '送出失敗,請稍後再試。');
        msgEl.textContent = r.data.message;
        msgEl.className = 'form-msg success';
        form.reset();
      })
      .catch(function(err){
        msgEl.textContent = err.message;
        msgEl.className = 'form-msg error';
      })
      .finally(function(){
        submitBtn.disabled = false;
        submitBtn.textContent = '寄送重設連結';
      });
  });
})();
</script>
</body>
</html>
