<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重設密碼 | 拾光花</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<nav>
  <a class="logo" href="index.html">拾光花</a>
  <div class="nav-links">
    <a href="index.html">回首頁</a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <h1>重設密碼</h1>
    <p class="auth-sub">請輸入你的新密碼</p>

    <form id="reset-form">
      <div class="form-group">
        <label for="password">新密碼</label>
        <input type="password" id="password" name="password" required maxlength="100" minlength="8">
        <label style="margin-top:6px;font-size:0.78rem;">至少 8 個字元</label>
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">重設密碼</button>
      <p class="form-msg" id="form-msg"></p>
    </form>

    <div class="auth-links">
      <a href="login.html">回到登入頁</a>
    </div>
  </div>
</div>

<script>
(function(){
  const form = document.getElementById('reset-form');
  const msgEl = document.getElementById('form-msg');
  const submitBtn = document.getElementById('submit-btn');
  const token = new URLSearchParams(window.location.search).get('token');

  if (!token) {
    form.style.display = 'none';
    msgEl.textContent = '重設密碼連結無效,請重新申請。';
    msgEl.className = 'form-msg error';
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    msgEl.textContent = '';
    msgEl.className = 'form-msg';
    submitBtn.disabled = true;
    submitBtn.textContent = '處理中...';

    fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, password: document.getElementById('password').value }),
    })
      .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(r){
        if (!r.ok) throw new Error(r.data.error || '重設失敗,請稍後再試。');
        msgEl.textContent = r.data.message + ' 即將前往登入頁...';
        msgEl.className = 'form-msg success';
        setTimeout(function(){ window.location.href = 'login.html'; }, 1800);
      })
      .catch(function(err){
        msgEl.textContent = err.message;
        msgEl.className = 'form-msg error';
        submitBtn.disabled = false;
        submitBtn.textContent = '重設密碼';
      });
  });
})();
</script>
</body>
</html>
