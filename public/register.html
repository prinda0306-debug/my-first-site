<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>會員註冊 | 拾光花</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<nav>
  <a class="logo" href="index.html">拾光花</a>
  <div class="nav-links">
    <a href="index.html">回首頁</a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <h1>會員註冊</h1>
    <p class="auth-sub">加入昱柔SPA,開始你的調理旅程</p>

    <form id="register-form">
      <div class="form-group">
        <label for="name">姓名</label>
        <input type="text" id="name" name="name" required maxlength="50">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required maxlength="100">
      </div>
      <div class="form-group">
        <label for="password">密碼</label>
        <input type="password" id="password" name="password" required maxlength="100" minlength="8">
        <label style="margin-top:6px;font-size:0.78rem;">至少 8 個字元</label>
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">註冊</button>
      <p class="form-msg" id="form-msg"></p>
    </form>

    <div class="auth-links">
      已經有帳號了？<a href="login.html">前往登入</a>
    </div>
  </div>
</div>

<script>
(function(){
  const form = document.getElementById('register-form');
  const msgEl = document.getElementById('form-msg');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    msgEl.textContent = '';
    msgEl.className = 'form-msg';
    submitBtn.disabled = true;
    submitBtn.textContent = '註冊中...';

    fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      }),
    })
      .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(r){
        if (!r.ok) throw new Error(r.data.error || '註冊失敗');
        window.location.href = r.data.user.role === 'admin' ? 'admin.html' : 'dashboard.html';
      })
      .catch(function(err){
        msgEl.textContent = err.message;
        msgEl.className = 'form-msg error';
        submitBtn.disabled = false;
        submitBtn.textContent = '註冊';
      });
  });
})();
</script>
</body>
</html>
