<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>會員中心 | 昱柔SPA蘆洲徐匯店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<nav>
  <a class="logo" href="index.html">昱柔SPA蘆洲徐匯店</a>
  <div class="nav-links">
    <a href="index.html">回首頁</a>
    <span id="nav-auth"></span>
  </div>
</nav>

<div class="dash-page">
  <div class="dash-header">
    <div>
      <h1>會員中心</h1>
      <p id="welcome-text">歡迎回來</p>
    </div>
  </div>

  <div class="dash-card">
    <h2>線上預約</h2>
    <form id="booking-form">
      <div class="form-group">
        <label for="service">服務項目</label>
        <select id="service" name="service" required>
          <option value="">請選擇服務項目</option>
          <option value="花晶身體調理">花晶身體調理</option>
          <option value="肌膚管理">肌膚管理</option>
          <option value="健康檢測">健康檢測</option>
        </select>
      </div>
      <div class="form-group">
        <label for="preferred_date">希望日期</label>
        <input type="date" id="preferred_date" name="preferred_date" required>
      </div>
      <div class="form-group">
        <label for="note">備註(選填)</label>
        <textarea id="note" name="note" rows="3" maxlength="300" placeholder="有什麼想先讓我們知道的嗎？"></textarea>
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">送出預約</button>
      <p class="form-msg" id="form-msg"></p>
    </form>
  </div>

  <div class="dash-card">
    <h2>我的預約紀錄</h2>
    <div id="booking-list">
      <p class="empty-note">載入中...</p>
    </div>
  </div>
</div>

<script src="js/nav-auth.js"></script>
<script src="js/chat-widget.js"></script>
<script>
(function(){
  const STATUS_LABEL = { pending: '待確認', confirmed: '已確認', cancelled: '已取消' };
  const welcomeText = document.getElementById('welcome-text');
  const bookingList = document.getElementById('booking-list');
  const form = document.getElementById('booking-form');
  const msgEl = document.getElementById('form-msg');
  const submitBtn = document.getElementById('submit-btn');

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function loadMe(){
    fetch('/api/auth/me')
      .then(function(res){
        if (!res.ok) throw new Error('unauthorized');
        return res.json();
      })
      .then(function(data){
        welcomeText.textContent = '歡迎回來,' + data.user.name;
      })
      .catch(function(){
        window.location.href = 'login.html';
      });
  }

  function renderBookings(bookings){
    if (!bookings.length){
      bookingList.innerHTML = '<p class="empty-note">還沒有預約紀錄,快去預約第一次服務吧！</p>';
      return;
    }
    bookingList.innerHTML = bookings.map(function(b){
      return '<div class="booking-item">' +
        '<div class="b-main">' +
          '<div class="b-service">' + escapeHtml(b.service) + '</div>' +
          '<div class="b-meta">希望日期:' + escapeHtml(b.preferred_date) + (b.note ? ' ・ ' + escapeHtml(b.note) : '') + '</div>' +
        '</div>' +
        '<span class="status-pill status-' + b.status + '">' + (STATUS_LABEL[b.status] || b.status) + '</span>' +
      '</div>';
    }).join('');
  }

  function loadBookings(){
    fetch('/api/bookings/me')
      .then(function(res){ return res.json(); })
      .then(function(data){ renderBookings(data.bookings || []); })
      .catch(function(){
        bookingList.innerHTML = '<p class="empty-note">載入預約紀錄失敗,請重新整理頁面。</p>';
      });
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    msgEl.textContent = '';
    msgEl.className = 'form-msg';
    submitBtn.disabled = true;
    submitBtn.textContent = '送出中...';

    fetch('/api/bookings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        service: document.getElementById('service').value,
        preferred_date: document.getElementById('preferred_date').value,
        note: document.getElementById('note').value.trim(),
      }),
    })
      .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(r){
        if (!r.ok) throw new Error(r.data.error || '預約送出失敗');
        msgEl.textContent = '預約已送出,我們會盡快與你確認！';
        msgEl.className = 'form-msg success';
        form.reset();
        loadBookings();
      })
      .catch(function(err){
        msgEl.textContent = err.message;
        msgEl.className = 'form-msg error';
      })
      .finally(function(){
        submitBtn.disabled = false;
        submitBtn.textContent = '送出預約';
      });
  });

  loadMe();
  loadBookings();
})();
</script>
</body>
</html>
